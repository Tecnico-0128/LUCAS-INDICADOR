<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Funcionários</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="topo">
        <h1>Controle de Funcionários</h1>
    </div>
    <div class="menu">
        <a href="cadastrar.html" class="ativo">Cadastrar</a> | 
        <a href="salario.html">Alterar Salário</a> |
        <a href="demissao.html">Demissão</a> |
        <a href="listagem.html">Listar</a>
    </div>
    <div class="principal">
        <div class="formulario-funcionario">
            <h2>Cadastrar Funcionários</h2>      
                <label>Nome:</label><br>
                <input id="nome" type="text"><br><br>
                <label>CPF:</label><br>
                <input id="cpf" type="text"><br><br>
                <label>Data de nascimento:</label><br>
                <input id="data" type="date"><br><br>
                <label>Salário:</label><br>
                <input id="salario" type="number"><br><br>
                <label>Função:</label><br>
                <input id="funcao" type="text"><br><br>
                <label>Estado Atual:</label><br>
                <input id="estado" type="string"><br><br>
                <button id="cadastrar" onclick="cadastrar()">Cadastrar Funcionário</button>

        </div>
    </div>
</body>
</html>
